<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>matchablepresence - Anime News Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900;1,900&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-dark: #070913;
            --accent-purple: #9333ea;
            --accent-green: #22c55e;
            --accent-pink: #ec4899;
            --card-bg: rgba(19, 27, 48, 0.9);
            --text-main: #ffffff;
            --text-muted: #cbd5e1;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            background-image: 
                linear-gradient(rgba(147, 51, 234, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(147, 51, 234, 0.05) 1px, transparent 1px),
                radial-gradient(circle at 85% 15%, rgba(34, 197, 94, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 15% 85%, rgba(236, 72, 153, 0.15) 0%, transparent 40%);
            background-size: 40px 40px, 40px 40px, 100% 100%, 100% 100%;
            background-attachment: fixed;
            min-height: 100vh;
        }
        header {
            text-align: center;
            padding: 70px 20px 40px 20px;
            border-bottom: 3px solid var(--accent-purple);
            background: rgba(13, 17, 33, 0.9);
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(147, 51, 234, 0.2);
        }
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 3.8rem;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            margin: 0;
            background: linear-gradient(135deg, #ffffff 20%, var(--accent-green) 60%, var(--accent-pink) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
            filter: drop-shadow(0 4px 15px rgba(34, 197, 94, 0.3));
        }
        p.subtitle {
            color: var(--text-muted);
            margin-top: 15px;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .news-grid {
            display: grid;
            gap: 30px;
        }
        .news-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(147, 51, 234, 0.4);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
            position: relative;
        }
        @media(min-width: 768px) {
            .news-card {
                flex-direction: row;
            }
        }
        .news-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-green);
            box-shadow: 0 12px 40px 0 rgba(34, 197, 94, 0.25);
        }
        .news-img-container {
            width: 100%;
            height: 200px;
            background: #000;
            overflow: hidden;
            flex-shrink: 0;
        }
        @media(min-width: 768px) {
            .news-img-container {
                width: 300px;
                height: auto;
                min-height: 200px;
            }
        }
        .news-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .news-card:hover .news-img-container img {
            transform: scale(1.05);
        }
        .news-content-box {
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }
        .news-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.35rem;
            font-weight: 700;
            margin: 0 0 12px 0;
            color: var(--text-main);
            text-decoration: none;
            display: block;
            line-height: 1.35;
        }
        .news-title:hover {
            color: var(--accent-green);
        }
        .news-meta {
            font-size: 0.75rem;
            color: var(--bg-dark);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            background: var(--accent-green);
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            width: fit-content;
        }
        .news-summary {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin: 0 0 15px 0;
        }
        .card-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 12px;
            margin-top: auto;
        }
        .share-btn {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            color: white;
            border: none;
            padding: 8px 16px;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 0.85rem;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .share-btn:hover {
            opacity: 0.85;
        }
        .card-watermark {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-style: italic;
            font-size: 0.85rem;
            background: linear-gradient(135deg, var(--accent-green), var(--accent-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }
        
        /* Neon Pagination Button Styling */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 50px;
            align-items: center;
        }
        .page-btn {
            background: rgba(19, 27, 48, 0.9);
            border: 2px solid var(--accent-purple);
            color: var(--text-main);
            padding: 10px 18px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .page-btn:hover:not(:disabled) {
            background: var(--accent-purple);
            border-color: var(--accent-green);
            box-shadow: 0 0 15px rgba(147, 51, 234, 0.5);
        }
        .page-btn.active {
            background: var(--accent-green);
            color: var(--bg-dark);
            border-color: var(--accent-green);
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.5);
        }
        .page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: rgba(255, 255, 255, 0.1);
        }

        footer {
            text-align: center;
            padding: 60px 0;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 3px solid var(--accent-purple);
            margin-top: 80px;
            background: rgba(13, 17, 33, 0.9);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>matchablepresence</h1>
            <p class="subtitle">⚡ High-Voltage Anime News Hub</p>
        </header>

        <!-- News Feed Container -->
        <main id="news-feed" class="news-grid">
            <!-- News cards will be dynamically paginated here -->
        </main>

        <!-- Pagination Controls -->
        <div id="pagination-controls" class="pagination"></div>

        <footer>
            <p>&copy; 2026 matchablepresence. Powered by Netlify, Vercel & GitHub Actions.</p>
        </footer>
    </div>

    <script>
        function shareCard(button) {
            const card = button.closest('.news-card');
            const btn = button;
            btn.innerText = "Generating...";
            btn.style.display = 'none';

            html2canvas(card, {
                scale: 2,
                useCORS: true,
                backgroundColor: '#070913'
            }).then(canvas => {
                btn.style.display = 'inline-block';
                btn.innerText = "📸 Share Card";

                const link = document.createElement('a');
                link.download = 'matchablepresence-news.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                console.error("Error generating image:", err);
                btn.style.display = 'inline-block';
                btn.innerText = "📸 Share Card";
                alert("Could not generate image. Try again!");
            });
        }

        // Pagination Logic
        document.addEventListener("DOMContentLoaded", () => {
            const feed = document.getElementById('news-feed');
            const controls = document.getElementById('pagination-controls');
            const cards = Array.from(feed.getElementsByClassName('news-card'));
            
            const itemsPerPage = 5; // Shows 5 news cards per page
            let currentPage = 1;
            const totalPages = Math.ceil(cards.length / itemsPerPage);

            function showPage(page) {
                currentPage = page;
                const start = (page - 1) * itemsPerPage;
                const end = start + itemsPerPage;

                cards.forEach((card, index) => {
                    card.style.display = (index >= start && index < end) ? 'flex' : 'none';
                });

                renderControls();
                window.scrollTo({ top: 300, behavior: 'smooth' });
            }

            function renderControls() {
                if (totalPages <= 1) {
                    controls.innerHTML = '';
                    return;
                }

                let html = `<button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})">◀ Prev</button>`;
                
                for (let i = 1; i <= totalPages; i++) {
                    html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
                }

                html += `<button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})">Next ▶</button>`;
                controls.innerHTML = html;
            }

            window.changePage = function(page) {
                if (page < 1 || page > totalPages) return;
                showPage(page);
            };

            if (cards.length > 0) {
                showPage(1);
            }
        });
    </script>
</body>
</html>
