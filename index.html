<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>matchablepresence - Anime News Magazine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-color: #f8f9fc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-purple: #7c3aed;
            --border-color: #e2e8f0;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }
        nav {
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            color: var(--accent-purple);
            text-decoration: none;
        }
        .nav-links {
            display: flex;
            gap: 24px;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
        }
        .nav-links span {
            cursor: pointer;
            transition: color 0.2s;
        }
        .nav-links span:hover {
            color: var(--accent-purple);
        }
        .wrapper {
            max-width: 1280px;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 30px;
        }
        @media(max-width: 1024px) {
            .wrapper {
                grid-template-columns: 1fr;
            }
        }
        .hero-banner {
            background: #0f172a;
            color: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }
        @media(max-width: 768px) {
            .hero-banner {
                grid-template-columns: 1fr;
            }
        }
        .hero-content {
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .hero-badge {
            background: rgba(124, 58, 237, 0.2);
            color: #a78bfa;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 6px;
            width: fit-content;
            margin-bottom: 16px;
        }
        .hero-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            line-height: 1.3;
            margin: 0 0 16px 0;
            color: #ffffff;
            text-decoration: none;
        }
        .hero-title:hover {
            color: #c4b5fd;
        }
        .hero-summary {
            font-size: 0.95rem;
            color: #94a3b8;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .hero-img {
            width: 100%;
            height: 100%;
            min-height: 280px;
            object-fit: cover;
        }
        .main-feed-area {
            display: flex;
            flex-direction: column;
        }
        .section-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
            border-left: 4px solid var(--accent-purple);
            padding-left: 10px;
        }
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 20px;
        }
        .news-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
        }
        .news-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .news-img-container {
            width: 100%;
            height: 160px;
            background: #cbd5e1;
            overflow: hidden;
        }
        .news-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .news-content-box {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }
        .news-meta {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--accent-purple);
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .news-title {
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-main);
            text-decoration: none;
            line-height: 1.4;
            margin-bottom: 10px;
            display: block;
        }
        .news-title:hover {
            color: var(--accent-purple);
        }
        .news-summary {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 14px;
        }
        .card-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
            margin-top: auto;
        }
        .share-btn {
            background: var(--bg-color);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .share-btn:hover {
            background: var(--accent-purple);
            color: #fff;
            border-color: var(--accent-purple);
        }
        .card-watermark {
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }
        aside {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        .sidebar-box {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }
        .sidebar-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }
        .trending-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .trending-item {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            text-decoration: none;
            color: var(--text-main);
        }
        .trending-num {
            font-family: 'Outfit', sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            color: #cbd5e1;
            line-height: 1;
        }
        .trending-text {
            font-size: 0.85rem;
            font-weight: 600;
            line-height: 1.4;
        }
        .trending-text:hover {
            color: var(--accent-purple);
        }
        .pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 40px;
        }
        .page-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 14px;
            font-weight: 600;
            font-size: 0.85rem;
            border-radius: 6px;
            cursor: pointer;
        }
        .page-btn.active {
            background: var(--accent-purple);
            color: #fff;
            border-color: var(--accent-purple);
        }
        .page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        footer {
            text-align: center;
            padding: 40px 0;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
            margin-top: 60px;
            background: #ffffff;
        }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="logo">matchablepresence</a>
        <div class="nav-links">
            <span>News</span>
            <span>Anime</span>
            <span>Manga</span>
            <span>Releases</span>
        </div>
    </nav>

    <div class="wrapper">
        <div class="main-feed-area">
            <div id="hero-spotlight"></div>
            <div class="section-title">Latest Updates</div>
            
            <main id="news-feed" class="news-grid">
                <!-- News cards injected here -->
            </main>

            <div id="pagination-controls" class="pagination"></div>
        </div>

        <aside>
            <div class="sidebar-box">
                <div class="sidebar-title">🔥 Trending Now</div>
                <ul class="trending-list" id="trending-sidebar"></ul>
            </div>
        </aside>
    </div>

    <footer>
        <p>&copy; 2026 matchablepresence. All rights reserved.</p>
    </footer>

    <script>
        function shareCard(button) {
            const card = button.closest('.news-card') || button.closest('.hero-banner');
            const btn = button;
            btn.innerText = "Generating...";
            btn.style.display = 'none';

            html2canvas(card, {
                scale: 2,
                useCORS: true,
                backgroundColor: '#ffffff'
            }).then(canvas => {
                btn.style.display = 'inline-block';
                btn.innerText = "📸 Share Card";

                const link = document.createElement('a');
                link.download = 'matchablepresence-news.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            }).catch(err => {
                console.error("Error generating image:", err);
                btn.style.display = 'inline-block';
                btn.innerText = "📸 Share Card";
                alert("Could not generate image. Try again!");
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            const feed = document.getElementById('news-feed');
            const hero = document.getElementById('hero-spotlight');
            const trendingList = document.getElementById('trending-sidebar');
            const controls = document.getElementById('pagination-controls');
            const cards = Array.from(feed.getElementsByClassName('news-card'));

            if (cards.length > 0 && hero.innerHTML.trim() === '') {
                const firstCard = cards[0];
                const titleEl = firstCard.querySelector('.news-title');
                const summaryEl = firstCard.querySelector('.news-summary');
                const imgEl = firstCard.querySelector('img');
                const link = titleEl ? titleEl.href : '#';
                const title = titleEl ? titleEl.innerText : '';
                const summary = summaryEl ? summaryEl.innerText : '';
                const imgSrc = imgEl ? imgEl.src : '';

                hero.innerHTML = `
                    <div class="hero-banner">
                        <div class="hero-content">
                            <div class="hero-badge">Featured Story</div>
                            <a href="${link}" target="_blank" class="hero-title">${title}</a>
                            <p class="hero-summary">${summary}</p>
                            <div>
                                <button class="share-btn" style="background:#7c3aed; color:#fff; border:none; padding:8px 16px; font-weight:600; border-radius:6px; cursor:pointer;" onclick="shareCard(this)">📸 Share Card</button>
                            </div>
                        </div>
                        ${imgSrc ? `<img src="${imgSrc}" class="hero-img" alt="Featured">` : ''}
                    </div>
                `;
                cards[0].remove();
            }

            const remainingCards = Array.from(feed.getElementsByClassName('news-card'));
            let trendingHtml = '';
            remainingCards.slice(0, 5).forEach((card, idx) => {
                const t = card.querySelector('.news-title');
                if (t) {
                    trendingHtml += `
                        <li>
                            <a href="${t.href}" target="_blank" class="trending-item">
                                <span class="trending-num">0${idx + 1}</span>
                                <span class="trending-text">${t.innerText}</span>
                            </a>
                        </li>
                    `;
                }
            });
            trendingList.innerHTML = trendingHtml;

            const itemsPerPage = 6;
            let currentPage = 1;
            const totalPages = Math.ceil(remainingCards.length / itemsPerPage);

            function showPage(page) {
                currentPage = page;
                const start = (page - 1) * itemsPerPage;
                const end = start + itemsPerPage;

                remainingCards.forEach((card, index) => {
                    card.style.display = (index >= start && index < end) ? 'flex' : 'none';
                });

                renderControls();
                window.scrollTo({ top: 400, behavior: 'smooth' });
            }

            function renderControls() {
                if (totalPages <= 1) {
                    controls.innerHTML = '';
                    return;
                }

                let html = `<button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})">Prev</button>`;
                for (let i = 1; i <= totalPages; i++) {
                    html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
                }
                html += `<button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})">Next</button>`;
                controls.innerHTML = html;
            }

            window.changePage = function(page) {
                if (page < 1 || page > totalPages) return;
                showPage(page);
            };

            if (remainingCards.length > 0) {
                showPage(1);
            }
        });
    </script>
</body>
</html>
