<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>matchablepresence - Anime News Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900;1,900&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070913;
            --accent-purple: #9333ea;
            --accent-green: #22c55e;
            --accent-pink: #ec4899;
            --text-main: #ffffff;
            --text-muted: #cbd5e1;
        }
        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            /* Glossy mesh background effect */
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(147, 51, 234, 0.25) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, rgba(34, 197, 94, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(236, 72, 153, 0.15) 0%, transparent 50%);
            background-attachment: fixed;
            min-height: 100vh;
        }
        header {
            text-align: center;
            padding: 70px 20px 40px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(13, 17, 33, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 3.8rem;
            font-weight: 900;
            font-style: italic;
            text-transform: uppercase;
            margin: 0;
            background: linear-gradient(135deg, #ffffff 30%, var(--accent-pink) 70%, var(--accent-green) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
            text-shadow: 0 10px 30px rgba(147, 51, 234, 0.3);
        }
        p.subtitle {
            color: var(--text-muted);
            margin-top: 15px;
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .news-grid {
            display: grid;
            gap: 25px;
        }
        /* Glossy Glassmorphism Card Effect */
        .news-card {
            background: rgba(19, 27, 48, 0.55);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 28px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .news-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            transition: 0.5s;
        }
        .news-card:hover {
            transform: translateY(-5px);
            border-color: rgba(236, 72, 153, 0.6);
            box-shadow: 0 12px 40px 0 rgba(147, 51, 234, 0.25);
        }
        .news-card:hover::after {
            left: 100%;
        }
        .news-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0 0 12px 0;
            color: var(--text-main);
            text-decoration: none;
            display: block;
            line-height: 1.35;
        }
        .news-title:hover {
            color: var(--accent-pink);
        }
        .news-meta {
            font-size: 0.8rem;
            color: var(--accent-green);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
            background: rgba(34, 197, 94, 0.1);
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(34, 197, 94, 0.3);
        }
        .news-summary {
            font-size: 1.05rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin: 0;
        }
        footer {
            text-align: center;
            padding: 60px 0;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            margin-top: 80px;
            background: rgba(13, 17, 33, 0.4);
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>matchablepresence</h1>
            <p class="subtitle">⚡ High-Voltage Anime News Hub</p>
        </header>

        <main id="news-feed" class="news-grid">
            <!-- News posts will appear here automatically -->
            <div class="news-card">
                <span class="news-meta">System Online</span>
                <h3 class="news-title">Glossy Glassmorphism Effect Applied!</h3>
                <p class="news-summary">Your site now features a high-end glossy aesthetic with bold typography, blur effects, and custom neon gradients.</p>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 matchablepresence. Powered by Netlify & GitHub Actions.</p>
        </footer>
    </div>
</body>
</html>
