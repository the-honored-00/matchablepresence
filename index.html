<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>matchablepresence - Anime News Magazine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --bg: #f8f9fc;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --accent: #7c3aed;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
        }
        a { color: inherit; }

        nav {
            background: #fff;
            border-bottom: 1px solid var(--border);
            padding: 16px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            font-family: 'Outfit', sans-serif;
            font-size: 1.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.5px;
            color: var(--accent);
            text-decoration: none;
        }
        .nav-links { display: flex; gap: 24px; font-size: 0.9rem; font-weight: 500; }
        .nav-links a { color: var(--muted); text-decoration: none; }
        .nav-links a:hover { color: var(--accent); }

        .wrapper {
            max-width: 1280px;
            margin: 30px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 30px;
        }
        @media (max-width: 1024px) { .wrapper { grid-template-columns: 1fr; } }

        .hero-banner {
            background: #0f172a;
            color: #fff;
            border-radius: 16px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }
        @media (max-width: 768px) { .hero-banner { grid-template-columns: 1fr; } }
        .hero-content {
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .hero-badge {
            background: rgba(124, 58, 237, 0.2);
            color: #a78bfa;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 6px;
            width: fit-content;
            margin-bottom: 16px;
        }
        .hero-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.8rem;
            font-weight: 800;
            line-height: 1.3;
            margin: 0 0 16px;
            color: #fff;
            text-decoration: none;
        }
        .hero-title:hover { color: #c4b5fd; }
        .hero-summary { font-size: 0.95rem; color: #94a3b8; line-height: 1.6; margin: 0 0 24px; }
        .hero-media { min-height: 280px; background: #1e293b; }
        .hero-media img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .hero-share { background: var(--accent); color: #fff; border: none; padding: 8px 16px; }

        .section-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1.2rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 20px;
            letter-spacing: 0.5px;
            border-left: 4px solid var(--accent);
            padding-left: 10px;
        }
        .updated {
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: none;
            color: var(--muted);
            margin-left: 10px;
        }
        .status { color: var(--muted); padding: 20px 0; }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
            gap: 20px;
            scroll-margin-top: 90px;
        }
        .news-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .news-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05); }
        .news-img-container { width: 100%; height: 160px; background: #cbd5e1; overflow: hidden; }
        .news-img-container img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .news-content-box {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }
        .news-meta {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .news-title {
            font-size: 1rem;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 10px;
            display: block;
            text-decoration: none;
        }
        .news-title:hover { color: var(--accent); }
        .news-summary { font-size: 0.85rem; color: var(--muted); line-height: 1.5; margin: 0 0 14px; }
        .card-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border);
            padding-top: 10px;
            margin-top: auto;
        }
        .share-btn {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 6px 12px;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .share-btn:hover:not(:disabled) { background: var(--accent); color: #fff; border-color: var(--accent); }
        .share-btn:disabled { opacity: 0.6; cursor: wait; }
        .card-watermark { font-size: 0.7rem; font-weight: 800; color: var(--muted); letter-spacing: 0.5px; }

        aside { display: flex; flex-direction: column; gap: 30px; }
        .sidebar-box {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }
        .sidebar-title {
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }
        .trending-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 14px; }
        .trending-item { display: flex; gap: 12px; align-items: flex-start; text-decoration: none; color: var(--text); }
        .trending-item:hover .trending-text { color: var(--accent); }
        .trending-num { font-family: 'Outfit', sans-serif; font-size: 1.2rem; font-weight: 900; color: #cbd5e1; line-height: 1; }
        .trending-text { font-size: 0.85rem; font-weight: 600; line-height: 1.4; }

        .pagination { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 40px; }
        .page-btn {
            background: var(--card);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 14px;
            font-weight: 600;
            font-size: 0.85rem;
            border-radius: 6px;
            cursor: pointer;
        }
        .page-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        footer {
            text-align: center;
            padding: 40px 0;
            color: var(--muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border);
            margin-top: 60px;
            background: #fff;
        }
    </style>
</head>
<body>

    <nav>
        <a href="#" class="logo">matchablepresence</a>
        <div class="nav-links">
            <a href="#news-feed">News</a>
            <a href="#news-feed">Anime</a>
            <a href="#news-feed">Manga</a>
            <a href="#news-feed">Releases</a>
        </div>
    </nav>

    <div class="wrapper">
        <div class="main-feed">
            <section id="hero-spotlight" aria-label="Featured story"></section>

            <div class="section-title">Latest Updates <span id="updated" class="updated"></span></div>

            <div id="news-feed" class="news-grid" aria-live="polite"></div>

            <nav id="pagination-controls" class="pagination" aria-label="Pagination"></nav>
        </div>

        <aside>
            <div class="sidebar-box">
                <div class="sidebar-title">🔥 Trending Now</div>
                <ol class="trending-list" id="trending-sidebar"></ol>
            </div>
        </aside>
    </div>

    <footer>
        <p>&copy; <span id="year"></span> matchablepresence. All rights reserved.</p>
    </footer>

    <script>
        (() => {
            'use strict';

            const PER_PAGE = 6;
            const state = { items: [], page: 1 };
            const $ = (selector) => document.querySelector(selector);

            function el(tag, props = {}, children = []) {
                const node = document.createElement(tag);
                for (const [key, value] of Object.entries(props)) {
                    if (value === null || value === undefined || value === false) continue;
                    if (key === 'text') node.textContent = value;
                    else if (key === 'className') node.className = value;
                    else if (key.startsWith('on')) node.addEventListener(key.slice(2), value);
                    else node.setAttribute(key, value);
                }
                node.append(...children.filter(Boolean));
                return node;
            }

            function safeUrl(url) {
                try {
                    const u = new URL(url, location.href);
                    return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : '#';
                } catch {
                    return '#';
                }
            }

            function formatDate(iso) {
                const d = new Date(iso);
                return isNaN(d) ? '' : d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
            }

            function makeMedia(src, className) {
                if (!src || safeUrl(src) === '#') return null;
                const wrap = el('div', { className });
                const img = el('img', {
                    src: safeUrl(src),
                    alt: '',
                    loading: 'lazy',
                    referrerpolicy: 'no-referrer',
                });
                img.addEventListener('error', () => wrap.remove());
                wrap.append(img);
                return wrap;
            }

            async function shareCard(button) {
                const card = button.closest('.hero-banner') || button.closest('.news-card');
                const label = button.textContent;
                const isUi = (node) => node.classList && node.classList.contains('share-btn');

                const capture = (options) =>
                    html2canvas(card, { scale: 2, backgroundColor: '#ffffff', ...options })
                        .then((canvas) => canvas.toDataURL('image/png'));

                button.disabled = true;
                button.textContent = 'Generating…';
                try {
                    let dataUrl;
                    try {
                        dataUrl = await capture({ useCORS: true, ignoreElements: isUi });
                    } catch (_) {
                        dataUrl = await capture({
                            useCORS: false,
                            ignoreElements: (node) => isUi(node) || node.tagName === 'IMG',
                        });
                    }
                    const link = document.createElement('a');
                    link.download = 'matchablepresence-news.png';
                    link.href = dataUrl;
                    link.click();
                } catch (err) {
                    console.error('Could not create image', err);
                    alert('Could not create the image. Please try again.');
                } finally {
                    button.disabled = false;
                    button.textContent = label;
                }
            }

            function buildHero(item) {
                return el('div', { className: 'hero-banner' }, [
                    el('div', { className: 'hero-content' }, [
                        el('div', { className: 'hero-badge', text: 'Featured Story' }),
                        el('a', {
                            className: 'hero-title',
                            href: safeUrl(item.link),
                            target: '_blank',
                            rel: 'noopener noreferrer',
                            text: item.title,
                        }),
                        el('p', { className: 'hero-summary', text: item.summary }),
                        el('div', {}, [
                            el('button', {
                                className: 'share-btn hero-share',
                                type: 'button',
                                text: '📸 Share Card',
                                onclick: (e) => shareCard(e.currentTarget),
                            }),
                        ]),
                    ]),
                    makeMedia(item.image, 'hero-media'),
                ]);
            }

            function buildCard(item) {
                return el('article', { className: 'news-card' }, [
                    makeMedia(item.image, 'news-img-container'),
                    el('div', { className: 'news-content-box' }, [
                        el('div', {}, [
                            el('div', { className: 'news-meta', text: formatDate(item.published) }),
                            el('a', {
                                className: 'news-title',
                                href: safeUrl(item.link),
                                target: '_blank',
                                rel: 'noopener noreferrer',
                                text: item.title,
                            }),
                            el('p', { className: 'news-summary', text: item.summary }),
                        ]),
                        el('div', { className: 'card-actions' }, [
                            el('button', {
                                className: 'share-btn',
                                type: 'button',
                                text: '📸 Share Card',
                                onclick: (e) => shareCard(e.currentTarget),
                            }),
                            el('span', { className: 'card-watermark', text: 'MATCHABLEPRESENCE' }),
                        ]),
                    ]),
                ]);
            }

            function renderTrending(items) {
                $('#trending-sidebar').replaceChildren(...items.map((item, i) =>
                    el('li', {}, [
                        el('a', {
                            className: 'trending-item',
                            href: safeUrl(item.link),
                            target: '_blank',
                            rel: 'noopener noreferrer',
                        }, [
                            el('span', { className: 'trending-num', text: String(i + 1).padStart(2, '0') }),
                            el('span', { className: 'trending-text', text: item.title }),
                        ]),
                    ])
                ));
            }

            function renderControls(totalPages) {
                const box = $('#pagination-controls');
                if (totalPages <= 1) {
                    box.replaceChildren();
                    return;
                }
                const current = state.page;
                const go = (page) => () => goTo(page);

                const buttons = [
                    el('button', {
                        className: 'page-btn', type: 'button', text: 'Prev',
                        disabled: current === 1 ? '' : null,
                        onclick: go(current - 1),
                    }),
                ];
                for (let p = 1; p <= totalPages; p++) {
                    buttons.push(el('button', {
                        className: 'page-btn' + (p === current ? ' active' : ''),
                        type: 'button',
                        text: String(p),
                        'aria-label': `Page ${p}`,
                        'aria-current': p === current ? 'page' : null,
                        onclick: go(p),
                    }));
                }
                buttons.push(el('button', {
                    className: 'page-btn', type: 'button', text: 'Next',
                    disabled: current === totalPages ? '' : null,
                    onclick: go(current + 1),
                }));
                box.replaceChildren(...buttons);
            }

            function renderGrid() {
                const rest = state.items.slice(1);
                const totalPages = Math.max(1, Math.ceil(rest.length / PER_PAGE));
                state.page = Math.min(Math.max(1, state.page), totalPages);

                const start = (state.page - 1) * PER_PAGE;
                $('#news-feed').replaceChildren(...rest.slice(start, start + PER_PAGE).map(buildCard));
                renderControls(totalPages);
            }

            function goTo(page) {
                state.page = page;
                renderGrid();
                $('#news-feed').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            function render() {
                const [first] = state.items;
                if (!first) {
                    $('#hero-spotlight').replaceChildren();
                    $('#news-feed').replaceChildren(el('p', { className: 'status', text: 'No stories yet. Check back soon.' }));
                    $('#pagination-controls').replaceChildren();
                    renderTrending([]);
                    return;
                }
                $('#hero-spotlight').replaceChildren(buildHero(first));
                renderTrending(state.items.slice(1, 6));
                renderGrid();
            }

            async function load() {
                try {
                    const res = await fetch('news.json', { cache: 'no-store' });
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const data = await res.json();
                    state.items = Array.isArray(data.items) ? data.items : [];
                    if (data.updated) $('#updated').textContent = `· updated ${formatDate(data.updated)}`;
                    render();
                } catch (err) {
                    console.error('Could not load news.json', err);
                    $('#news-feed').replaceChildren(el('p', {
                        className: 'status',
                        text: 'News is unavailable right now. Please try again later.',
                    }));
                }
            }

            $('#year').textContent = new Date().getFullYear();
            load();
        })();
    </script>
</body>
</html>
