name: Update Anime News

on:
  schedule:
    # Runs automatically once every 24 hours
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install feedparser

      - name: Run news scraper
        run: python update_news.py

      - name: Commit and push changes if news updated
        run: |
          git config --global user.name "MatchablePresence Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update anime news feed" && git push)
